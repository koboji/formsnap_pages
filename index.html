<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormSnap - Your Child's Form, Perfected</title>
    <meta name="description" content="240fps slow-motion sports form analysis for young athletes. Record, analyze with guidelines, share with coaches.">
    <link rel="icon" type="image/png" id="fav">
    <link rel="apple-touch-icon" id="ati">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:#1d1d1f;-webkit-font-smoothing:antialiased;overflow-x:hidden}

        /* ===== LANG SWITCH ===== */
        .lsw{position:fixed;top:16px;right:16px;z-index:999;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-radius:10px;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.04)}
        .lsw a{padding:7px 14px;text-decoration:none;font:600 .72rem/1 'Inter',sans-serif;color:#999;transition:.2s;display:block}
        .lsw a.on{background:#1d1d1f;color:#fff}

        /* ===== HERO ===== */
        .hero{position:relative;min-height:100vh;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:80px 24px 48px;overflow:hidden}
        .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.3}
        .hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#000 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.55) 100%)}
        .hero-body{position:relative;z-index:2;max-width:600px;margin-bottom:40px}
        .hero-icon{width:72px;height:72px;border-radius:18px;margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.5)}
        .hero h1{font-size:2.8rem;font-weight:900;letter-spacing:-.04em;line-height:1.1;margin-bottom:14px}
        .hero h1 em{font-style:normal;color:#f4a261}
        .hero-sub{font-size:.95rem;color:rgba(255,255,255,.5);line-height:1.8;margin-bottom:28px}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:12px;font:700 .88rem/1 'Inter',sans-serif;text-decoration:none;transition:transform .2s,box-shadow .2s}
        .btn:hover{transform:translateY(-2px)}
        .btn-w{background:#fff;color:#1d1d1f;box-shadow:0 4px 20px rgba(0,0,0,.15)}
        .btn-d{background:#1d1d1f;color:#fff;box-shadow:0 4px 20px rgba(0,0,0,.1)}
        .btn svg{width:16px;height:16px;fill:currentColor}
        .apple-icon{width:16px;height:16px;fill:currentColor}

        /* KV CAROUSEL - infinite loop + edge fade */
        .hero-carousel{position:relative;z-index:2;width:100%;height:400px;overflow:hidden}
        .hero-carousel::before,.hero-carousel::after{content:'';position:absolute;top:0;bottom:0;width:100px;z-index:3;pointer-events:none}
        .hero-carousel::before{left:0;background:linear-gradient(90deg,rgba(0,0,0,.95),transparent)}
        .hero-carousel::after{right:0;background:linear-gradient(-90deg,rgba(0,0,0,.95),transparent)}
        .kv-track{display:flex;gap:14px;height:100%;align-items:center;animation:kvLoop 45s linear infinite;width:max-content}
        .kv-track img{height:350px;border-radius:18px;flex-shrink:0;box-shadow:0 16px 48px rgba(0,0,0,.45)}
        @keyframes kvLoop{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
        
        /* ===== 3-STEP FLOW ===== */
        .flow{padding:100px 24px;background:#fff}
        .flow-inner{max-width:960px;margin:0 auto}
        .flow-title{font-size:2.2rem;font-weight:800;text-align:center;letter-spacing:-.03em;margin-bottom:10px}
        .flow-sub{font-size:.95rem;color:#888;text-align:center;max-width:480px;margin:0 auto 64px}
        .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;text-align:center}
        .step{display:flex;flex-direction:column;align-items:center}
        .step img{width:100%;max-width:220px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.08);margin-bottom:16px}
        .step-label{display:inline-block;padding:6px 40px;border-radius:20px;background:linear-gradient(135deg,#e63946,#f4a261);color:#fff;font-size:1rem;font-weight:700;letter-spacing:.08em;margin:20px auto 10px}
        .step h3{font-size:1rem;font-weight:700;margin-bottom:6px}
        .step p{font-size:.85rem;color:#777;line-height:1.6}

        /* ===== FEATURE DEEP DIVE ===== */
        .dive{padding:80px 24px;background:#f8f9fb}
        .dive-inner{max-width:880px;margin:0 auto}
        .dive-row{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center;margin-bottom:88px}
        .dive-row:last-child{margin-bottom:0}
        .dive-row.flip .dive-visual{order:-1}
        .dive-visual{display:flex;justify-content:center}
        .dive-visual img{height:440px;border-radius:20px;box-shadow:0 12px 44px rgba(0,0,0,.07)}
        .dive-copy .tag{display:inline-block;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#e63946;margin-bottom:10px}
        .dive-copy h3{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:12px;line-height:1.3}
        .dive-copy p{font-size:.92rem;color:#555;line-height:1.8}

        /* ===== EXPORT (Pro) ===== */
        .export{padding:88px 24px;background:#fff}
        .export-inner{max-width:880px;margin:0 auto}
        .export-header{text-align:center;margin-bottom:52px}
        .export-header .tag{display:inline-block;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#e63946;margin-bottom:10px}
        .export-header h2{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
        .export-header p{font-size:.92rem;color:#888}
        .pro-pill{display:inline-block;padding:3px 20px;background:linear-gradient(135deg,#e63946,#f4a261);color:#fff;font-size:1rem;font-weight:700;border-radius:20px;margin-left:6px;vertical-align:middle;letter-spacing:.04em;position:relative;top:-2px}
        .export-body{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
        .export-feats{display:flex;flex-direction:column;gap:24px}
        .ef{display:flex;gap:14px;align-items:flex-start}
        .ef-ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
        .ef-ic.cam{background:#eff4ff}
        .ef-ic.yt{background:#fff0f1}
        .ef-ic.inf{background:#edfcf2}
        .ef h4{font-size:.92rem;font-weight:700;margin-bottom:3px}
        .ef p{font-size:.8rem;color:#888;line-height:1.5}
        .export-vis{display:flex;justify-content:center}
        .export-vis img{height:420px;border-radius:20px;box-shadow:0 12px 44px rgba(0,0,0,.07)}

        /* ===== PLANS ===== */
        .plans{padding:100px 24px;background:#f8f9fb}
        .plans-inner{max-width:780px;margin:0 auto}
        .plans-title{font-size:2.2rem;font-weight:800;text-align:center;letter-spacing:-.03em;margin-bottom:8px}
        .plans-sub{font-size:.95rem;color:#888;text-align:center;margin-bottom:56px}
        .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        .pc{padding:32px 24px;border-radius:16px;background:#fff;border:1px solid #eee}
        .pc.pro{border:2px solid #e63946;background:linear-gradient(160deg,#fffbfb,#fff8f2);position:relative}
        .pc.pro::before{content:'PRO';position:absolute;top:-14px;right:20px;padding:3px 20px;background:linear-gradient(135deg,#e63946,#f4a261);color:#fff;font-size:1rem;font-weight:700;border-radius:20px;letter-spacing:.05em}
        .pc h3{font-size:1.15rem;font-weight:800;margin-bottom:2px}
        .pc .price{font-size:.8rem;color:#aaa;margin-bottom:16px}
        .pc ul{list-style:none}
        .pc li{padding:6px 0;font-size:.84rem;color:#555;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f0f0f0}
        .pc li:last-child{border:none}
        .pc li .ck{color:#22c55e;font-weight:700;font-size:.9rem}
        .pc li .no{color:#ddd}
        .pc li.dim{color:#bbb}
        .pc li.hl{font-weight:600;color:#1d1d1f;background:rgba(230,57,70,.04);margin:0 -8px;padding:6px 8px;border-radius:6px}
        .plans-cta{text-align:center;margin-top:40px}

        /* ===== SPORTS ===== */
        .sports{padding:72px 24px;background:#fff;text-align:center}
        .sports h2{font-size:1.6rem;font-weight:800;margin-bottom:32px}
        .stags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:640px;margin:0 auto}
        .stags span{padding:8px 18px;background:#f8f9fb;border:1px solid #eee;border-radius:40px;font-size:.82rem;font-weight:500;color:#555;transition:.2s;cursor:default}
        .stags span:hover{border-color:#e63946;color:#e63946;transform:translateY(-1px)}

        /* ===== GALLERY - infinite + edge fade ===== */
        .gal{padding:72px 0;background:#0a0a0f;overflow:hidden}
        .gal h2{font-size:1.6rem;font-weight:800;color:#fff;text-align:center;margin-bottom:36px}
        .gal-wrap{overflow:hidden;position:relative}
        .gal-wrap::before,.gal-wrap::after{content:'';position:absolute;top:0;bottom:0;width:120px;z-index:2;pointer-events:none}
        .gal-wrap::before{left:0;background:linear-gradient(90deg,#0a0a0f,transparent)}
        .gal-wrap::after{right:0;background:linear-gradient(-90deg,#0a0a0f,transparent)}
        .gal-track{display:flex;gap:16px;animation:galLoop 38s linear infinite;width:max-content}
        .gal-track img{height:420px;border-radius:16px;flex-shrink:0;box-shadow:0 8px 28px rgba(0,0,0,.4)}
        @keyframes galLoop{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
        
        /* ===== TRUST ===== */
        .trust{padding:80px 24px;background:#f8f9fb;text-align:center}
        .trust h2{font-size:1.5rem;font-weight:800;line-height:1.6;margin-bottom:48px}
        .trust-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:680px;margin:0 auto}
        .tc{padding:20px 16px;border-radius:14px;background:#fff;border:1px solid #eee}
        .tc .ic{font-size:24px;margin-bottom:8px}
        .tc h4{font-size:.85rem;font-weight:700;margin-bottom:4px}
        .tc p{font-size:.78rem;color:#999;line-height:1.5}

        /* ===== CTA ===== */
        .cta{padding:100px 24px;text-align:center;color:#fff;background-size:cover;background-position:center;position:relative}
        .cta::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.72)}
        .cta-body{position:relative;z-index:1}
        .cta h2{font-size:2.2rem;font-weight:900;letter-spacing:-.03em;margin-bottom:12px}
        .cta h2 em{font-style:normal;color:#f4a261}
        .cta p{font-size:.95rem;color:rgba(255,255,255,.8);margin-bottom:36px}

        /* ===== FOOTER ===== */
        .foot{padding:36px 24px;background:#1d1d1f;text-align:center}
        .foot-links{display:flex;justify-content:center;gap:20px;margin-bottom:10px}
        .foot-links a{color:rgba(255,255,255,.5);text-decoration:none;font-size:.8rem;font-weight:500;transition:color .2s}
        .foot-links a:hover{color:#fff}
        .foot small{color:rgba(255,255,255,.25);font-size:.72rem}

        /* fade-in animation */
        .ao{opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}
        .ao.vis{opacity:1;transform:none}

        .sp{display:none}
        @media(max-width:768px){
            .sp{display:inline}
            .hero h1{font-size:2rem}
            .hero-carousel{height:280px}
            .kv-track img{height:250px}
            .steps{grid-template-columns:1fr;gap:48px}
            .dive-row{grid-template-columns:1fr;gap:32px;text-align:center}
            .dive-row.flip .dive-visual{order:0}
            .dive-visual img{height:300px}
            .export-body{grid-template-columns:1fr}
            .export-vis{order:-1}
            .export-vis img{height:320px}
            .pgrid{grid-template-columns:1fr}
            .flow-title,.plans-title{font-size:1.7rem}
            .dive-copy h3,.export-header h2{font-size:1.7rem}
            .trust-row{grid-template-columns:1fr}
            .cta h2{font-size:1.7rem}
            .gal-track img{height:300px}
            .hero-icon{width:56px;height:56px;border-radius:14px}
        }
    </style>
</head>

function R(l){
  var d=D[l],ip=d.ip,base=location.pathname.indexOf('/ja')>-1?'../':'';
  // lang switch hrefs
  document.getElementById('lk-en').href=base||'./';
  document.getElementById('lk-ja').href=base+'ja/';
  document.getElementById('lk-en').className=l==='en'?'on':'';
  document.getElementById('lk-ja').className=l==='ja'?'on':'';
  document.documentElement.lang=l;
  // prefix for images
  var pre=base+ip;
  // Hero
  document.getElementById('hero-bg').style.backgroundImage='url('+base+d.heroBg+')';
  document.getElementById('icon-img').src=base+'icon.png';
  document.getElementById('fav').href=base+'favicon.png';
  document.getElementById('ati').href=base+'apple-touch-icon.png';
  document.getElementById('h1').innerHTML=d.h1;
  document.getElementById('hsub').innerHTML=d.hsub;
  document.getElementById('hbtn').textContent=d.hbtn;
  document.getElementById('hcta').href=d.as;
  document.getElementById('pcta').href=d.as;
  document.getElementById('ccta').href=d.as;
  // KV carousel (duplicate 9 imgs x2 for seamless loop)
  var kv=document.getElementById('kv');kv.innerHTML='';
  for(var r=0;r<2;r++)for(var i=1;i<=9;i++){var m=document.createElement('img');m.src=pre+i+'.png';m.loading='lazy';kv.appendChild(m)}
  // Flow
  document.getElementById('ft').innerHTML=d.ft;
  document.getElementById('fs').textContent=d.fs;
  var se=document.getElementById('steps');se.innerHTML='';
  d.steps.forEach(function(s){se.innerHTML+='<div class="step"><img src="'+pre+s.i+'.png" loading="lazy"><div class="step-label">'+s.l+'</div><h3>'+s.t+'</h3><p>'+s.d+'</p></div>'});
  // Dives
  var dv=document.getElementById('dives');dv.innerHTML='';
  d.dives.forEach(function(v){dv.innerHTML+='<div class="dive-row'+(v.flip?' flip':'')+'"><div class="dive-copy"><div class="tag">'+v.tag+'</div><h3>'+v.t+'</h3><p>'+v.d+'</p></div><div class="dive-visual"><img src="'+pre+v.i+'.png" loading="lazy"></div></div>'});
  // Export
  document.getElementById('exlb').textContent=d.exLb;
  document.getElementById('ext').innerHTML=d.exT+' <span class="pro-pill">PRO</span>';
  document.getElementById('exs').textContent=d.exS;
  var eb=document.getElementById('exbody');eb.innerHTML='<div class="export-feats"></div><div class="export-vis"><img src="'+pre+d.exImg+'.png" loading="lazy"></div>';
  var ef=eb.querySelector('.export-feats');
  d.exF.forEach(function(f){ef.innerHTML+='<div class="ef"><div class="ef-ic '+f.cls+'">'+f.ic+'</div><div><h4>'+f.t+'</h4><p>'+f.d+'</p></div></div>'});
  // Plans
  document.getElementById('pt').innerHTML=d.pT;
  document.getElementById('ps').textContent=d.pS;
  document.getElementById('pbtn').textContent=d.pBtn;
  var pg=document.getElementById('pgrid');pg.innerHTML='';
  // Free
  var fh='<div class="pc"><h3>'+d.free.t+'</h3><div class="price">'+d.free.p+'</div><ul>';
  d.free.i.forEach(function(x){fh+='<li'+(x.y?'':' class="dim"')+'><span class="'+(x.y?'ck':'no')+'">'+(x.y?'\u2713':'\u2014')+'</span>'+x.t+'</li>'});
  pg.innerHTML+=fh+'</ul></div>';
  // Pro
  var ph='<div class="pc pro"><h3>'+d.pro.t+'</h3><div class="price">'+d.pro.p+'</div><ul>';
  d.pro.i.forEach(function(x){ph+='<li'+(x.h?' class="hl"':'')+'><span class="ck">\u2713</span>'+x.t+'</li>'});
  pg.innerHTML+=ph+'</ul></div>';
  // Sports
  document.getElementById('spt').innerHTML=d.sT;
  var tg=document.getElementById('stags');tg.innerHTML='';
  d.sp.forEach(function(s,i){tg.innerHTML+='<span>'+(d.si[i]?d.si[i]+' ':'')+s+'</span>'});
  // Gallery (duplicate for loop)
  document.getElementById('gt').textContent=d.gT;
  var gt=document.getElementById('gtrack');gt.innerHTML='';
  for(var r=0;r<2;r++)for(var i=1;i<=9;i++){gt.innerHTML+='<img src="'+pre+i+'.png" loading="lazy">'}
  // Trust
  document.getElementById('trt').innerHTML=d.trT;
  var tr=document.getElementById('trow');tr.innerHTML='';
  d.trC.forEach(function(c){tr.innerHTML+='<div class="tc"><div class="ic">'+c.c+'</div><h4>'+c.t+'</h4><p>'+c.d+'</p></div>'});
  // CTA
  document.getElementById('sec-cta').style.backgroundImage='url('+base+d.ctaBg+')';
  document.getElementById('ct').innerHTML=d.ctT;
  document.getElementById('csub').innerHTML=d.ctS;
  document.getElementById('cbtn').textContent=d.ctBtn;
  // Footer
  var fl=document.getElementById('flinks');fl.innerHTML='';
  d.fLinks.forEach(function(f){fl.innerHTML+='<a href="'+base+f.u+'">'+f.t+'</a>'});
  // Scroll animations
  document.querySelectorAll('.ao').forEach(function(el){
    new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting)e.target.classList.add('vis')})},{threshold:.1}).observe(el);
  });
}

(function(){
  var isJa=location.pathname.indexOf('/ja')>-1;
  R(isJa?'ja':'en');
})();
