<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormSnap - Baseball Form Analysis</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #1c2129;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-dim: #1f3a5f;
            --border: #30363d;
            --green: #3fb950;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 40px 24px;
            text-align: center;
        }

        .logo {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, #58a6ff 0%, #3fb950 100%);
            border-radius: 22px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 8px 32px rgba(88, 166, 255, 0.15);
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 48px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 360px;
            margin: 0 auto;
        }

        .links a {
            display: block;
            padding: 16px 24px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .links a:hover {
            border-color: var(--accent);
            background-color: var(--accent-dim);
        }

        .links a .label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 400;
        }

        .footer {
            margin-top: 64px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .footer a:hover {
            color: var(--accent);
        }

        @media (max-width: 600px) {
            .container {
                padding: 32px 16px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .tagline {
                font-size: 1rem;
                margin-bottom: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo" role="img" aria-label="FormSnap app icon">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="10" stroke="white" stroke-width="2.5" fill="none"/>
                <path d="M24 14C24 14 28 18 28 24C28 30 24 34 24 34" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <path d="M24 14C24 14 20 18 20 24C20 30 24 34 24 34" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <line x1="14" y1="24" x2="34" y2="24" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <path d="M8 8L16 16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="7" cy="7" r="3" stroke="white" stroke-width="2" fill="none"/>
            </svg>
        </div>

        <h1>FormSnap</h1>
        <p class="tagline">Slow-motion video recording &amp; analysis for baseball</p>

        <div class="links">
            <a href="privacy-policy.html">
                Privacy Policy
                <span class="label">English</span>
            </a>
            <a href="privacy-policy-ja.html">
                &#12503;&#12521;&#12452;&#12496;&#12471;&#12540;&#12509;&#12522;&#12471;&#12540;
                <span class="label">&#26085;&#26412;&#35486; / Japanese</span>
            </a>
        </div>

        <div class="footer">
            <p>&copy; 2026 agemon333</p>
            <p style="margin-top: 4px;">
                <a href="mailto:agemon333@gmail.com">agemon333@gmail.com</a>
            </p>
        </div>
    </div>
</body>
</html>
