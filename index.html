<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormSnap - Slow-Motion Sports Form Analysis</title>
    <meta name="description" content="Record slow-motion videos to analyze and improve your child's sports form. Share with coaches via YouTube or camera roll.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #1a1a2e;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Language switcher */
        .lang-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .lang-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            color: #888;
            transition: all 0.2s;
            font-family: inherit;
        }

        .lang-btn.active {
            background: #111;
            color: #fff;
        }

        /* ===== HERO ===== */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 24px 80px;
            background: linear-gradient(160deg, #0f0c29 0%, #302b63 40%, #24243e 100%);
            color: #fff;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(230,57,70,0.15) 0%, transparent 50%),
                        radial-gradient(circle at 70% 30%, rgba(37,99,235,0.12) 0%, transparent 50%);
            animation: heroGlow 8s ease-in-out infinite alternate;
        }

        @keyframes heroGlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-3%, 3%); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 680px;
        }

        .hero-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
            color: rgba(255,255,255,0.8);
            margin-bottom: 28px;
            backdrop-filter: blur(4px);
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero h1 .highlight {
            background: linear-gradient(135deg, #e63946, #f4a261);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-desc {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 40px;
            line-height: 1.7;
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 32px;
            background: #fff;
            color: #111;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .hero-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .hero-fps {
            margin-top: 60px;
            display: flex;
            justify-content: center;
            gap: 48px;
        }

        .fps-stat {
            text-align: center;
        }

        .fps-stat .number {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #e63946, #f4a261);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .fps-stat .label {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        /* ===== FEATURES ===== */
        .features-section {
            padding: 100px 24px;
            background: #fff;
        }

        .section-header {
            text-align: center;
            max-width: 560px;
            margin: 0 auto 64px;
        }

        .section-label {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #e63946;
            margin-bottom: 12px;
        }

        .section-header h2 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .section-header p {
            font-size: 1.05rem;
            color: #666;
            line-height: 1.7;
        }

        .features-grid {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .f-card {
            padding: 36px 28px;
            border-radius: 20px;
            background: #fafafa;
            border: 1px solid #f0f0f0;
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .f-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
        }

        .f-card .icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .f-card .icon.red { background: #fff0f1; }
        .f-card .icon.blue { background: #eff4ff; }
        .f-card .icon.green { background: #edfcf2; }
        .f-card .icon.orange { background: #fff8ed; }
        .f-card .icon.purple { background: #f5f0ff; }
        .f-card .icon.gray { background: #f3f4f6; }

        .f-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .f-card p {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.6;
        }

        /* ===== SPORTS ===== */
        .sports-section {
            padding: 100px 24px;
            background: linear-gradient(180deg, #f8f9fb 0%, #fff 100%);
        }

        .sports-grid {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .s-tag {
            padding: 12px 24px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 50px;
            font-size: 0.92rem;
            font-weight: 500;
            color: #444;
            transition: all 0.2s;
            cursor: default;
        }

        .s-tag:hover {
            border-color: #e63946;
            color: #e63946;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(230,57,70,0.1);
        }

        /* ===== COACHES ===== */
        .coaches-section {
            padding: 100px 24px;
            background: #fff;
        }

        .coaches-content {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .coaches-text h2 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .coaches-text p {
            font-size: 1.05rem;
            color: #666;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .share-cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .share-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 24px;
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 16px;
            transition: transform 0.2s;
        }

        .share-card:hover { transform: translateX(4px); }

        .share-card .s-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .share-card .s-icon.cam { background: #eff4ff; }
        .share-card .s-icon.yt { background: #fff0f1; }

        .share-card .s-text .name { font-weight: 700; font-size: 0.95rem; }
        .share-card .s-text .desc { font-size: 0.85rem; color: #888; margin-top: 2px; }

        .coaches-visual {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-mockup {
            width: 260px;
            height: 520px;
            background: linear-gradient(160deg, #1a1a2e 0%, #302b63 100%);
            border-radius: 36px;
            border: 4px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }

        .phone-mockup .notch {
            position: absolute;
            top: 12px;
            width: 100px;
            height: 24px;
            background: #111;
            border-radius: 12px;
        }

        .phone-mockup .screen-content {
            text-align: center;
            padding: 20px;
        }

        .phone-mockup .play-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(230,57,70,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
        }

        .phone-mockup .speed-label {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #e63946, #f4a261);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .phone-mockup .speed-sub {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
        }

        /* ===== LEGAL / FOOTER ===== */
        .legal-section {
            padding: 60px 24px;
            background: #f8f9fb;
            text-align: center;
        }

        .legal-section h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #888;
            margin-bottom: 16px;
        }

        .legal-link {
            display: inline-block;
            padding: 12px 24px;
            color: #555;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.2s;
            background: #fff;
        }

        .legal-link:hover {
            border-color: #e63946;
            color: #e63946;
        }

        .lang-only-en, .lang-only-ja { display: none; }
        body.lang-en .lang-only-en { display: inline-block; }
        body.lang-ja .lang-only-ja { display: inline-block; }

        .footer {
            text-align: center;
            padding: 32px 24px;
            background: #111;
            color: rgba(255,255,255,0.4);
            font-size: 0.82rem;
        }

        .footer a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover { color: #fff; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.6rem; }
            .hero-desc { font-size: 1rem; }
            .hero-fps { gap: 32px; }
            .fps-stat .number { font-size: 1.8rem; }
            .features-grid { grid-template-columns: 1fr; max-width: 400px; }
            .section-header h2 { font-size: 1.8rem; }
            .coaches-content { grid-template-columns: 1fr; gap: 40px; }
            .coaches-visual { order: -1; }
            .phone-mockup { width: 200px; height: 400px; border-radius: 28px; }
            .coaches-text h2 { font-size: 1.8rem; }
        }
    </style>
</head>

    <script>
        function setLang(lang) {
            document.querySelectorAll('[data-en]').forEach(function(el) {
                el.textContent = el.getAttribute('data-' + lang);
            });
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-ja').classList.toggle('active', lang === 'ja');
            document.documentElement.lang = lang;
            document.body.className = 'lang-' + lang;
            localStorage.setItem('formsnap-lang', lang);
        }

        (function() {
            var saved = localStorage.getItem('formsnap-lang');
            if (saved) { setLang(saved); return; }
            var lang = (navigator.language || 'en').startsWith('ja') ? 'ja' : 'en';
            setLang(lang);
        })();
    </script>
